<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squeekchain Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
      min-height: 100vh;
      padding: 20px;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .subtitle { color: #8b98a5; margin-bottom: 30px; font-size: 0.95rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .card {
      background: #1a2332;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 20px;
    }
    .card .label { color: #8b98a5; font-size: 0.85rem; margin-bottom: 6px; }
    .card .value { font-size: 1.6rem; font-weight: 600; }
    .card .unit { font-size: 0.9rem; color: #8b98a5; margin-left: 4px; }
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
    }
    .status.online { background: #0d3b2e; color: #00ba7c; }
    .status.idle { background: #3b2f0d; color: #ffd400; }
    .section-title {
      font-size: 1.1rem;
      margin: 30px 0 12px;
      color: #e7e9ea;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #1a2332;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #2f3336;
      font-size: 0.9rem;
    }
    th { background: #15202b; color: #8b98a5; font-weight: 500; }
    .footer {
      margin-top: 40px;
      text-align: center;
      color: #8b98a5;
      font-size: 0.85rem;
    }
    .footer a { color: #1d9bf0; text-decoration: none; }
    .loading { text-align: center; padding: 40px; color: #8b98a5; }
    .error { color: #f4212e; padding: 20px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐹 Squeekchain Dashboard</h1>
    <p class="subtitle">Live data from the hamster-powered toychain · Community project for Buildooooor badge</p>

    <div id="content">
      <div class="loading">Loading data from Squeekchain API...</div>
    </div>

    <div class="footer">
      Built for <a href="https://squeekchain.com" target="_blank">Squeekchain</a> · 
      Data from official API · Not affiliated with the official team
    </div>
  </div>

  <script>
    async function loadData() {
      const content = document.getElementById('content');
      try {
        // Fetch status
        const statusRes = await fetch('https://api.squeekchain.com/v1/status');
        const status = await statusRes.json();

        // Fetch economy
        const ecoRes = await fetch('https://api.squeekchain.com/v1/economy/state');
        const eco = await ecoRes.json();

        // Fetch recent settlements
        const setRes = await fetch('https://api.squeekchain.com/v1/settlements?range=24h');
        const settlements = await setRes.json();

        // Extract data safely
        const blockHeight = status?.builder?.anchor?.blockHeight || '—';
        const blockProgress = status?.builder?.anchor?.blockProgress || '0';
        const cumulativeWork = status?.measurement?.cumulativeWorkUnits || '—';
        const freshness = status?.measurement?.freshness || 'unknown';
        const coreStatus = status?.measurement?.coreStatus || '—';
        const distanceKm = status?.measurement?.distanceMm 
          ? (Number(status.measurement.distanceMm) / 1000000).toFixed(2) 
          : '—';

        const liveSupply = eco?.supply?.liveSupplyBaseUnits 
          ? (Number(eco.supply.liveSupplyBaseUnits) / 1e18).toLocaleString(undefined, {maximumFractionDigits: 0})
          : '—';

        const recent = (settlements?.recentSettlements || []).slice(0, 8);

        // Render
        content.innerHTML = `
          <div class="grid">
            <div class="card">
              <div class="label">Block Height</div>
              <div class="value">${blockHeight}</div>
            </div>
            <div class="card">
              <div class="label">Cumulative Work</div>
              <div class="value">${Number(cumulativeWork).toLocaleString()}</div>
            </div>
            <div class="card">
              <div class="label">Distance Run</div>
              <div class="value">${distanceKm}<span class="unit">km</span></div>
            </div>
            <div class="card">
              <div class="label">Status</div>
              <div class="value">
                <span class="status ${freshness === 'online' ? 'online' : 'idle'}">${freshness.toUpperCase()}</span>
              </div>
            </div>
            <div class="card">
              <div class="label">Core Status</div>
              <div class="value" style="font-size:1.2rem">${coreStatus}</div>
            </div>
            <div class="card">
              <div class="label">Live SQK Supply</div>
              <div class="value" style="font-size:1.3rem">${liveSupply}</div>
            </div>
          </div>

          <div class="section-title">Recent Settlements (last 24h)</div>
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>Blocks</th>
                <th>Work Added</th>
                <th>Tx</th>
              </tr>
            </thead>
            <tbody>
              ${recent.map(s => `
                <tr>
                  <td>${new Date(s.blockTimestamp).toLocaleString()}</td>
                  <td>${s.completedBlockCount || 0}</td>
                  <td>${s.workAdded || 0}</td>
                  <td>
                    <a href="https://sepolia.etherscan.io/tx/${s.transactionHash}" target="_blank" style="color:#1d9bf0">
                      ${s.transactionHash.slice(0,10)}...
                    </a>
                  </td>
                </tr>
              `).join('') || '<tr><td colspan="4">No recent settlements</td></tr>'}
            </tbody>
          </table>
        `;
      } catch (err) {
        content.innerHTML = `<div class="error">Failed to load data. Please refresh.<br>${err.message}</div>`;
        console.error(err);
      }
    }

    loadData();
    // Auto refresh every 60 seconds
    setInterval(loadData, 60000);
  </script>
</body>
</html>
